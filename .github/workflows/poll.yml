name: Pivot Itinerary Poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      search_window:
        description: >-
          One-off Gmail window override for THIS manual run only, e.g.
          "newer_than:3d". Used to recover bookings older than the normal
          window after an outage. Leave blank to use the SEARCH_WINDOW secret.
          Scheduled runs are never affected. Note this only widens the SEARCH —
          a booking already in processed_ids.json is still skipped, so it cannot
          re-send anything that was already delivered.
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pivot-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the CURRENT tip of main, NOT the commit pinned when this
          # run was queued. Polls queue behind one another, so a run can start
          # minutes after it was created; with the pinned SHA it reads a
          # processed_ids.json that predates bookings an earlier run already
          # handled, re-processes them, re-uploads to Drive and re-sends a
          # duplicate confirmation, then fails its own push as non-fast-forward.
          # Observed on 85K5MN, IFZH5N and 8CP5SK.
          ref: main
          # full history so the rebase in "Commit processed log" works
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright's CDN geo-blocks some GitHub runner regions outright with
      # "403 ... this service is not available in your location", which failed
      # the whole run on 2026-08-19. Every run used to download the browser
      # fresh, so a single bad runner took the pipeline down. Cache it (keyed on
      # the pinned version) so a normal run reuses an existing download and
      # never touches the CDN at all.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.62.0

      - name: Install Playwright Chromium
        run: |
          # Retry as well, so a transient refusal on a cache miss does not fail
          # the run. Exits as soon as one attempt succeeds.
          for i in 1 2 3; do
            if python -m playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $i failed — retrying"
            sleep 10
          done
          echo "::error::could not install Chromium after 3 attempts"
          exit 1

      - name: Run poll
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IMPERSONATE_USER: ${{ secrets.IMPERSONATE_USER }}
          SENDER_USER: ${{ secrets.SENDER_USER }}
          DRIVE_OUTPUT_FOLDER: ${{ secrets.DRIVE_OUTPUT_FOLDER }}
          AKBAR_FOLDER_NAME: ${{ secrets.AKBAR_FOLDER_NAME }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          # Manual-run override falls back to the secret when blank, and the
          # secret is what every scheduled run uses.
          SEARCH_WINDOW: ${{ github.event.inputs.search_window || secrets.SEARCH_WINDOW }}
          PIVOT_OS_SYNC_URL: ${{ secrets.PIVOT_OS_SYNC_URL }}
          PIVOT_OS_SYNC_SECRET: ${{ secrets.PIVOT_OS_SYNC_SECRET }}
          PIVOT_OS_DRY_RUN: ${{ vars.PIVOT_OS_DRY_RUN }}   # set repo var to "1" to dry-run the live poll
          DEBUG_VERBOSE: ${{ vars.DEBUG_VERBOS }}
        run: python main.py

      - name: Commit processed log
        run: |
          if [[ -z "$(git status --porcelain processed_ids.json disruption_ids.json flagged_ids.json medic_ids.json)" ]]; then
            echo "No new bookings or alerts — logs unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_ids.json disruption_ids.json flagged_ids.json medic_ids.json
          git commit -m "chore: update processed log [skip ci]"
          # Another poll (or the medic) may have pushed while this one ran.
          # Rebase onto it and retry rather than failing the run outright and
          # leaving the log unrecorded — an unrecorded booking is re-processed
          # and re-sent next run.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            echo "log push attempt $i failed — retrying"
            sleep 5
          done
          echo "::error::could not push the processed log"
          exit 1
