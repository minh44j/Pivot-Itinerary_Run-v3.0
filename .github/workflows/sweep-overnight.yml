name: Sweep overnight-connection dates

# Re-extracts every already-processed booking with the overnight-connection
# correction OFF and ON, and reports the ones whose leg dates differ — i.e. the
# documents that were issued with a connecting leg dated a day early.
# Read-only: it sends nothing and writes nothing. The log carries message_ids
# only, never PNRs or names (§11 — the repo is public).

on:
  workflow_dispatch:
    inputs:
      window:
        description: 'Gmail window to sweep, e.g. "newer_than:120d"'
        required: false
        default: "newer_than:120d"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sweep
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          IMPERSONATE_USER: ${{ secrets.IMPERSONATE_USER }}
          DRIVE_OUTPUT_FOLDER: ${{ secrets.DRIVE_OUTPUT_FOLDER }}
          AKBAR_FOLDER_NAME: ${{ secrets.AKBAR_FOLDER_NAME }}
          SWEEP_WINDOW: ${{ github.event.inputs.window }}
        run: python tools/sweep_overnight.py
